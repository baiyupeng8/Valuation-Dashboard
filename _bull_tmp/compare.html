<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:40px;background:#F7F5EF;font-family:-apple-system,"PingFang SC",sans-serif;color:#1B211C}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:#FFFDF8;border-radius:28px;padding:28px;box-shadow:0 18px 40px -28px rgba(27,33,28,.5)}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;color:#6b736c;margin:0 0 14px}
img{width:100%;display:block}
.t{font-family:Georgia,"Songti SC",serif;font-size:34px;margin:6px 0 0}
.t b{color:#C03A2B}
.note{font-size:12px;color:#8a918b;margin-top:10px;line-height:1.6}
</style></head><body>
<div class="grid">
  <div class="card"><h2>现在用的（只有三条腿）</h2><img src="../images/bull-ink.png"><p class="t">今天，市场<b>温和</b>。</p><p class="note">后腿两条、前腿一条抬起来。</p></div>
  <div class="card"><h2>方案 A · 原图风格补第四条腿</h2><img src="bull_D_pad.png"><p class="t">今天，市场<b>温和</b>。</p><p class="note">牛的朝向、牛头、尾巴、体态都没动。</p></div>
  <div class="card"><h2>方案 B · 重新画的四腿腾空版</h2><img src="bull_C_pad.png"><p class="t">今天，市场<b>温和</b>。</p><p class="note">身体比例更修长，头更小一些。</p></div>
</div>
</body></html>
