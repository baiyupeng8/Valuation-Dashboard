name: Daily Valuation Update

on:
  schedule:
    # 每天北京时间 16:30 (UTC 时间 08:30) 自动运行
    - cron: '30 8 * * *'
  workflow_dispatch: # 允许你在网页上手动点击运行测试

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas pyecharts pytz

      - name: Run main script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard $(date +'%Y-%m-%d')" && git push)
